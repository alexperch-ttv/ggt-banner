<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>Gun Game Trios — OBS</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=JetBrains+Mono:wght@700&family=Russo+One&family=Black+Ops+One&family=Montserrat:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--accent:#E3A93C;--bg:rgba(15,16,13,.90);--line:rgba(227,169,60,.22);--text:#ECE6D3;--muted:#8F8A78}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:transparent;overflow:hidden;height:100%}   /* высота на всё окно источника — иначе при &scale=2 низ баннера обрезается */
body{font-family:'Oswald','Arial Narrow',Arial,sans-serif;color:var(--text);padding:6px}
.mono{font-family:'JetBrains Mono',Consolas,monospace}
.card{width:420px;background:var(--bg);border:1px solid var(--line);border-left:4px solid var(--accent);
  border-radius:6px;overflow:hidden;transform-origin:top left;box-shadow:0 6px 20px rgba(0,0,0,.4)}
.top{display:flex;justify-content:space-between;align-items:center;padding:5px 12px;
  border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.top b{color:var(--accent);font-weight:500}
.clock{display:flex;align-items:center;gap:6px;letter-spacing:.04em;white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.dot.live{background:#4CD97B;animation:ping 1.6s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(76,217,123,.7)}70%,100%{box-shadow:0 0 0 6px rgba(76,217,123,0)}}
.dot.err{background:#E0533D}

/* одна команда */
.one{display:flex;justify-content:space-between;align-items:center;padding:8px 12px 9px;gap:10px}
.name{font-size:26px;font-weight:700;line-height:1;text-transform:uppercase;letter-spacing:.03em;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:15px;color:#BDB7A2;margin-top:5px;letter-spacing:.01em;white-space:nowrap;display:flex;gap:6px}
.sub .nk{overflow:hidden;text-overflow:ellipsis;min-width:0}
.sub .rk{flex:none;display:inline-block}
.pts .n.d3{font-size:30px}.pts .n.d4{font-size:25px}
.pts{text-align:right;line-height:1;flex:none}
.pts .n{font-size:36px;color:var(--accent);display:inline-block;transition:transform .25s}
.pts .n.bump{transform:scale(1.2)}
.of9{font-size:15px;color:var(--muted);margin-left:1px}
.row .of9{font-size:12px}
.pts small{display:block;max-width:120px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-left:auto;font-size:10px;letter-spacing:.18em;color:var(--muted);margin-top:3px;text-transform:uppercase}

/* несколько команд */
.row{display:grid;grid-template-columns:20px 1fr auto;align-items:center;gap:8px;padding:6px 12px;
  border-top:1px solid rgba(236,230,211,.06)}
.row:first-child{border-top:0}
.row .r{font-size:12px;color:var(--muted)}
.row .t{font-size:19px;font-weight:700;text-transform:uppercase;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t .rn{display:block;font-size:11px;font-weight:500;color:var(--muted);text-transform:none;margin-top:3px}
.row .n{font-size:24px;color:var(--accent);transition:transform .25s}
.row .n.bump{transform:scale(1.2)}
.row.lead .r{color:var(--accent)}


/* итоговый ТОП-5 после финиша */
.row.f{padding:4px 12px}
.row.f .t{font-size:17px}
.row.f .n{font-size:20px}
.row.p1 .tx{color:#F4C64E}.row.p2 .tx{color:#D6E6F7}.row.p3 .tx{color:#D9905A}
.row.me .r{position:relative}
.row.me .r::before{content:'';position:absolute;left:-7px;top:50%;width:3px;height:16px;margin-top:-8px;border-radius:2px;background:var(--accent)}   /* своя команда — маркер, цвет места не перекрывает */
.row.me .r{color:var(--accent)}
.sep{text-align:center;color:var(--muted);font-size:12px;line-height:1;padding:1px 0 3px;letter-spacing:.3em}

/* призовые места: цвет ников + значок у названия */
.name{display:flex;align-items:center;gap:8px}
.name .tx{overflow:hidden;text-overflow:ellipsis;min-width:0}
.ico{flex:none;width:26px;height:26px;fill:none;stroke:currentColor;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.badge{flex:none;font-size:11px;letter-spacing:.12em;padding:2px 6px 1px;border:1.5px solid currentColor;border-radius:4px;line-height:1.2}
.p1 .ico,.p1 .sub{color:#F4C64E}
.p3 .sub{text-shadow:0 0 10px rgba(217,144,90,.2)}
.p2 .ico,.p2 .sub{color:#D6E6F7}
.p3 .ico,.p3 .sub{color:#D9905A}
.p10 .badge{color:var(--accent)}
.row .tw{display:flex;align-items:center;gap:6px}
.row .ico{width:18px;height:18px}
.row.p1 .rn{color:#F4C64E}.row.p2 .rn{color:#D6E6F7}.row.p3 .rn{color:#D9905A}
.row .t .ico{color:inherit}
.row.p1 .ico{color:#F4C64E}.row.p2 .ico{color:#D6E6F7}.row.p3 .ico{color:#D9905A}
.row .badge{font-size:9px;padding:1px 4px}

/* микро-анимации */
.ico{animation:pop .55s cubic-bezier(.3,1.7,.5,1) both}
@keyframes pop{0%{transform:scale(0) rotate(-25deg);opacity:0}100%{transform:none;opacity:1}}
.p1 .ico{animation:pop .55s cubic-bezier(.3,1.7,.5,1) both,bob 3s ease-in-out .6s infinite}
@keyframes bob{0%,100%{transform:none}50%{transform:translateY(-2px) rotate(-5deg)}}
.p2 .ico{transform-origin:50% 0;animation:pop .55s cubic-bezier(.3,1.7,.5,1) both,swing 3.4s ease-in-out .6s infinite}
@keyframes swing{0%,100%{transform:rotate(0)}25%{transform:rotate(9deg)}75%{transform:rotate(-9deg)}}
.p3 .ico{animation:pop .55s cubic-bezier(.3,1.7,.5,1) both,twinkle 4s ease-in-out .6s infinite}
@keyframes twinkle{0%,78%,100%{transform:none}86%{transform:scale(1.2) rotate(18deg)}93%{transform:scale(.95) rotate(-4deg)}}
.badge{animation:pop .5s cubic-bezier(.3,1.7,.5,1) both,bglow 2.8s ease-in-out .5s infinite}
@keyframes bglow{0%,100%{box-shadow:0 0 0 rgba(227,169,60,0)}50%{box-shadow:0 0 9px rgba(227,169,60,.55)}}
/* перелив по никам у 1 и 2 места */
.p1 .sub > span,.p2 .sub > span{-webkit-background-clip:text;background-clip:text;color:transparent;
  background-size:300% 100%;animation:shimmer 5s linear infinite}
.p1 .sub > span{background-image:linear-gradient(100deg,#F4C64E 42%,#FFF4C9 50%,#F4C64E 58%)}
.p2 .sub > span{background-image:linear-gradient(100deg,#D6E6F7 42%,#FFFFFF 50%,#D6E6F7 58%)}
@keyframes shimmer{0%{background-position:100% 0}60%,100%{background-position:0 0}}
/* смена места: строка с местом вспыхивает */
.one.chg .sub .rk:last-child{animation:rkflash 1.4s ease-out}
@keyframes rkflash{0%{opacity:0;transform:translateY(8px)}25%{opacity:1;transform:none;filter:brightness(2)}100%{filter:none}}


/* котик команды perchikotiki — живёт на строке ников, цикл 5 минут (замкнутый, без рывков):
   дремлет (zzz) → зевает, потягивается → умывается → гуляет по alexperch_ → прыгает на okinokki →
   охотится → прыгает на lapps_ → перекат через бок на спинку → дремлет → ловит хвост →
   возвращается через все ники → охотится → умывается, перекат → засыпает. */
.sub{position:relative;height:19px;line-height:19px}
.sub.has-cat{margin-top:16px}
.cat{position:absolute;top:-10px;left:0;width:21px;height:14px;   /* лапы ровно на верхушках букв (l, k, h) */
  pointer-events:none;
  will-change:transform;backface-visibility:hidden;   /* свой постоянный слой: позиция не «переснапывается», когда рядом стартуют другие анимации */
  animation:cX 300s linear infinite;animation-delay:var(--cd,0s)}
.cat .cy{display:block;position:absolute;inset:0;will-change:transform;backface-visibility:hidden;animation:cY 300s ease-in-out infinite;animation-delay:var(--cd,0s)}
.cat svg{shape-rendering:geometricPrecision;filter:drop-shadow(0 1px 0 rgba(0,0,0,.7));display:block;   /* тёмный кант снизу отделяет котика от букв того же цвета */
  width:100%;height:100%;overflow:visible;fill:currentColor;animation:cFl 300s linear infinite;animation-delay:var(--cd,0s)}
.cat .rl{transform-box:view-box;transform-origin:12px 8.35px;animation:cRl 300s ease-in-out infinite;animation-delay:var(--cd,0s)}
.cat .bd{transform-box:view-box;transform-origin:5px 12.5px;animation:cBd 300s ease-in-out infinite;animation-delay:var(--cd,0s)}
.cat .hd{transform-box:view-box;transform-origin:16.4px 8.6px;animation:cHd 300s ease-in-out infinite;animation-delay:var(--cd,0s)}
.cat .eye{transform-box:fill-box;transform-origin:50% 50%;animation:cEy 300s linear infinite;animation-delay:var(--cd,0s)}
.cat .ey{fill:#151510;transform-box:fill-box;transform-origin:50% 50%;animation:cBlink 4.3s linear infinite}
.cat .gW,.cat .gS,.cat .gT,.cat .gB,.cat .pw{opacity:0}
.cat .gN{animation:gN 300s linear infinite;animation-delay:var(--cd,0s)}
.cat .gT .hd{transform-origin:16.4px 6.8px}
.cat .gW{animation:gW 300s linear infinite;animation-delay:var(--cd,0s)}
.cat .gS{animation:gS 300s linear infinite;animation-delay:var(--cd,0s)}
.cat .gT{animation:gT 300s linear infinite;animation-delay:var(--cd,0s)}
.cat .gB{animation:gB 300s linear infinite;animation-delay:var(--cd,0s)}
.cat .pw{animation:gP 300s linear infinite;animation-delay:var(--cd,0s)}
.cat .gW rect{transform-box:fill-box;transform-origin:50% 0;animation:cLeg .45s ease-in-out infinite alternate}
.cat .gW rect:nth-child(even){animation-direction:alternate-reverse}
.cat .gB rect{transform-box:fill-box;transform-origin:50% 0;animation:cKick .35s ease-in-out infinite alternate}
.cat .gB rect:nth-child(even){animation-direction:alternate-reverse}
.cat .tl{transform-box:fill-box;transform-origin:100% 100%;animation:cTail 3.4s ease-in-out infinite alternate}
.cat .tA{animation:gTa 300s linear infinite;animation-delay:var(--cd,0s)}
.cat .tS{opacity:0;animation:gZ 300s linear infinite;animation-delay:var(--cd,0s)}   /* во сне хвост поджат и не шевелится */
.cat .zz{position:absolute;left:1px;top:-6px;width:12px;height:10px;font:700 7px/1 'Oswald',sans-serif;animation:gZ 300s linear infinite;animation-delay:var(--cd,0s)}
.cat .zz b{position:absolute;left:0;bottom:0;opacity:0;animation:cZ 3s linear infinite}
.cat .zz b:nth-child(2){animation-delay:1s}.cat .zz b:nth-child(3){animation-delay:2s}
@keyframes cLeg{from{transform:rotate(28deg)}to{transform:rotate(-28deg)}}
@keyframes cKick{from{transform:rotate(14deg)}to{transform:rotate(-14deg)}}
@keyframes cTail{from{transform:rotate(-9deg)}to{transform:rotate(10deg)}}
@keyframes cBlink{0%,95%,100%{transform:none}97.5%{transform:scaleY(.1)}}
@keyframes cZ{0%{opacity:0;transform:translate(0,0)}20%{opacity:.9}100%{opacity:0;transform:translate(-3px,-6px)}}

/* ========================= ТЕМЫ: &style=... ========================= */

/* glass — светлое «стекло», мягко и современно */
.s-glass{--accent:#7FF0C8;--text:#fff;--muted:rgba(255,255,255,.62);--line:rgba(255,255,255,.16)}
.s-glass, .s-glass .mono{font-family:'Montserrat',Arial,sans-serif}
.s-glass .card{background:linear-gradient(135deg,rgba(40,44,60,.62),rgba(20,22,32,.55));border:1px solid rgba(255,255,255,.18);
  border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.18)}
.s-glass .top{border:0;padding:8px 14px 0;letter-spacing:.1em;font-weight:500}
.s-glass .top b{color:var(--muted)}
.s-glass .name{font-weight:800;text-transform:none;font-size:25px;letter-spacing:-.01em}
.s-glass .pts .n,.s-glass .row .n{font-weight:800;background:linear-gradient(135deg,#7FF0C8,#69B7FF);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.s-glass .one{padding:6px 14px 12px}
.s-glass .row .t{text-transform:none;font-weight:800}

/* neon — киберпанк, свечение */
.s-neon{--accent:#FF3DF2;--text:#EFFFFF;--muted:#5FE7F5;--line:rgba(25,240,255,.35)}
.s-neon, .s-neon .name, .s-neon .row .t{font-family:'Russo One','Oswald',sans-serif}
.s-neon .card{background:rgba(6,6,14,.92);border:1px solid var(--line);border-radius:0;
  clip-path:polygon(0 0,calc(100% - 16px) 0,100% 16px,100% 100%,16px 100%,0 calc(100% - 16px));
  box-shadow:inset 0 0 24px rgba(25,240,255,.12)}
.s-neon .card::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 3px)}
.s-neon .card{position:relative}
.s-neon .top b{color:var(--muted);text-shadow:0 0 8px rgba(95,231,245,.6)}
.s-neon .name{font-weight:400;text-shadow:0 0 10px rgba(95,231,245,.45)}
.s-neon .pts .n,.s-neon .row .n{text-shadow:0 0 6px #FF3DF2,0 0 18px rgba(255,61,242,.6)}

/* mil — армейский: олива, трафарет, «скотч» */
.s-mil{--accent:#D8C26A;--text:#E9E6D2;--muted:#A9AA8C;--line:rgba(0,0,0,.35)}
.s-mil .card{background:linear-gradient(180deg,rgba(58,64,42,.95),rgba(40,45,30,.95));border:1px solid #1d2015;border-left:0;border-radius:2px}
.s-mil .top{background:repeating-linear-gradient(135deg,#D8C26A 0 14px,#C9B158 14px 28px);color:#1e1f14;border:0;font-weight:700}
.s-mil .top b{color:#1e1f14;font-weight:700}
.s-mil .dot:not(.live):not(.err){background:#1e1f14}
.s-mil .name,.s-mil .row .t{font-family:'Black Ops One','Oswald',sans-serif;font-weight:400;letter-spacing:.04em}
.s-mil .pts{background:#D8C26A;color:#1e1f14;padding:6px 10px;border-radius:2px}
.s-mil .pts .n{color:#1e1f14;font-size:32px}
.s-mil .pts small{color:#3b3c2a}
.s-mil .row .n{color:var(--accent)}

/* pill — минимальная плашка в одну строку */
.s-pill .card{width:auto;display:inline-flex;border-radius:999px;border-left:1px solid var(--line);padding-left:6px}
.s-pill .top{border:0;padding:0 18px 0 4px;order:2}
.s-pill .top > span:first-child{display:none}
.s-pill .one{padding:6px 16px 6px 12px;gap:14px}
.s-pill .sub,.s-pill .pts small{display:none}
.s-pill .name{font-size:20px}
.s-pill .pts .n{font-size:24px}
.s-pill .one::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
</style>

let TOTAL = NAMES.length;
// название из ссылки — без учёта регистра; неизвестное показываем как есть
const picked = CONFIG.team.split(',').map(s => s.trim()).filter(Boolean).slice(0, 3)
  .map(s => NAMES[LOWER.indexOf(s.toLowerCase())] || s);

/* баллы с сайта (последние значения сохраняются между перезапусками OBS) */
const KEY = 'ggt:' + picked.join(',');
let pts = {}, rank = {}, live = false;
try { pts = JSON.parse(localStorage.getItem(KEY)) || {}; } catch(e){}
/* полный зачёт всех команд — нужен для итогового ТОП-5 после финиша */
let all = {};
try { all = JSON.parse(localStorage.getItem('ggt:all')) || {}; } catch(e){}
for (const k in all) if (!(all[k] >= 1 && all[k] <= 10)) delete all[k];   // только тиры 1–9 и 10 = готово
for (const k in pts) if (!(pts[k] >= 1 && pts[k] <= 10)) delete pts[k];
let rankEnd = {};
function rankOf(data){
  const sorted = Object.entries(data).sort((a, b) => b[1] - a[1]), r = {};   // одинаковые баллы — одинаковое место
  sorted.forEach(([n, v], i) => r[n] = i && v === sorted[i - 1][1] ? r[sorted[i - 1][0]] : i + 1);
  // одинаковый тир — общее место; запоминаем, до какого места тянется группа (напр. 2–9)
  rankEnd = {}; const cnt = {};
  for (const n in r) cnt[r[n]] = (cnt[r[n]] || 0) + 1;
  for (const n in r) rankEnd[n] = r[n] + cnt[r[n]] - 1;
  return r;
}
rank = rankOf(all);   // заполняет и rankEnd
const isFinal = () => Date.now() >= CONFIG.end && Object.keys(all).length > 0;
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(pts)); } catch(e){} };

/* число команд: до старта обновляется, после старта замораживается на последнем значении */
let haveTotal = false;
try { const t = +localStorage.getItem('ggt:total'); if (t){ TOTAL = t; haveTotal = true; } } catch(e){}
function setTotal(n){
  if (!n) return;
  if (Date.now() >= CONFIG.start && haveTotal) return;   // после старта — заморожено
  TOTAL = n; haveTotal = true;
  try { localStorage.setItem('ggt:total', n); } catch(e){}
}

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => '&#' + c.charCodeAt(0) + ';');
$('card').style.transform = `scale(${CONFIG.scale})`;
const prev = {};


/* призовые значки */
const ICON = {
  crown: '<svg class="ico" viewBox="0 0 24 24"><path d="M4 18h16M5 15.5 3.5 7l5 3.8L12 4.5l3.5 6.3 5-3.8L19 15.5z"/></svg>',
  medal: '<svg class="ico" viewBox="0 0 24 24"><path d="M8.5 11 6 3h4l2 4.5L14 3h4l-2.5 8"/><circle cx="12" cy="15.5" r="5"/></svg>',
  star:  '<svg class="ico" viewBox="0 0 24 24"><path d="M12 3.5l2.6 5.3 5.8.8-4.2 4.1 1 5.8L12 16.8l-5.2 2.7 1-5.8-4.2-4.1 5.8-.8z"/></svg>',
};
const lvl = (r, e = r) => !r ? 0 : e <= 3 ? r : e <= 10 ? 10 : 0;   // e — конец группы с тем же тиром
const place = (r, e) => ({1: 'p1', 2: 'p2', 3: 'p3', 10: 'p10'})[lvl(r, e)] || '';
const mark = (r, e) => ({1: ICON.crown, 2: ICON.medal, 3: ICON.star, 10: '<span class="badge">TOP 10</span>'})[lvl(r, e)] || '';
const rk = t => !rank[t] ? '' : rankEnd[t] > rank[t] ? rank[t] + '–' + rankEnd[t] : String(rank[t]);


/* котик */
const CAT_POS = [[2, 0.2], [2, 0.95], [2, 0], [1, 1], [1, 0.55], [1, 0.15], [1, 0], [0, 1], [0, 0.4], [1, 0.5], [2, 0.6], [2, 0.85]];   // [ник, доля ширины] для каждой точки остановки
const CAT_TEAM = 'perchikotiki';   // котик живёт только у этой команды
const CAT = `<i class="cat"><i class="cy"><span class="zz"><b>z</b><b>z</b><b>z</b></span><svg viewBox="0 0 24 16"><g class="rl"><g class="gW"><rect x="6" y="11.5" width="1.5" height="4" rx=".7"/><rect x="8.4" y="11.5" width="1.5" height="4" rx=".7"/><rect x="13.2" y="11.5" width="1.5" height="4" rx=".7"/><rect x="15.6" y="11.5" width="1.5" height="4" rx=".7"/></g><g class="gS"><rect x="6" y="11.5" width="1.5" height="4" rx=".7"/><rect x="8.4" y="11.5" width="1.5" height="4" rx=".7"/><rect x="13.2" y="11.5" width="1.5" height="4" rx=".7"/><rect x="15.6" y="11.5" width="1.5" height="4" rx=".7"/></g><g class="gB"><rect x="6" y="12" width="1.5" height="2.6" rx=".7"/><rect x="8.4" y="12" width="1.5" height="2.6" rx=".7"/><rect x="13.2" y="12" width="1.5" height="2.6" rx=".7"/><rect x="15.6" y="12" width="1.5" height="2.6" rx=".7"/></g><g class="gN"><g class="bd"><g class="tA"><path class="tl" d="M5 9 C1.6 8.4 1.2 4.2 3.4 2.6" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></g><path class="tS" d="M5 9.4 C2.6 10.6 3.4 13.6 7 13.4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><ellipse cx="11.2" cy="9.4" rx="7" ry="4"/><ellipse class="pw" cx="20.4" cy="9.8" rx="1.7" ry="1.3"/><g class="hd"><circle cx="18.6" cy="6.4" r="3.3"/><path d="M16.2 4.6 16.6 1.2 18.6 3.4zM18.9 3.2 21.0 1.4 21.3 4.6z"/><g class="eye"><circle class="ey" cx="19.8" cy="6" r=".55"/></g></g></g></g><g class="gT"><path class="tl" d="M7.4 15.2 C3.6 15.6 2.8 12.6 4.6 11.3" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/><ellipse cx="10.6" cy="12.2" rx="4.6" ry="3.4"/><ellipse cx="14.6" cy="9.4" rx="3" ry="4.6" transform="rotate(-14 14.6 9.4)"/><rect x="14.2" y="10" width="1.7" height="5.5" rx=".8"/><rect x="16.1" y="10" width="1.7" height="5.5" rx=".8"/><ellipse class="pw" cx="19.6" cy="7.4" rx="1.6" ry="1.25"/><g class="hd"><circle cx="17.2" cy="4.6" r="3.3"/><path d="M14.8 2.8 15.2 -0.6 17.2 1.6zM17.5 1.4 19.6 -0.4 19.9 2.8z"/><g class="eye"><circle class="ey" cx="18.4" cy="4.2" r=".55"/></g></g></g></g></svg></i></i>`;
const nicks = t => TEAMS[t].map(n => t === CAT_TEAM ? `<span class="nm">${n}</span>` : n).join(' · ');
function placeCat(){
  const sub = document.querySelector('.sub.has-cat'), cat = sub && sub.querySelector('.cat');
  if (!cat) return;
  const nk = sub.querySelector('.nk'), lim = nk.offsetLeft + nk.clientWidth;
  const A = [], Wd = [];
  sub.querySelectorAll('.nm').forEach((el, i) => {   // опорные точки: начало и ширина каждого ника
    const x = Math.min(el.offsetLeft, lim - 21), w = Math.max(21, Math.min(el.offsetWidth, lim - x));
    A[i] = x; Wd[i] = w; cat.style.setProperty('--a' + i, x + 'px'); cat.style.setProperty('--w' + i, w + 'px');
  });
  // точки остановки — строго целые пиксели, чтобы в покое котик не «дрожал» от округления
  CAT_POS.forEach(([i, f], k) => cat.style.setProperty('--p' + k, Math.round((A[i] || 0) + ((Wd[i] || 21) - 21) * f) + 'px'));
  if (!cat.dataset.on){ cat.dataset.on = 1; cat.style.setProperty('--cd', -(Date.now() % 300000) + 'ms'); }   // фаза по часам
}

let lastHTML = '', lastRank;
let wasFinal = null;
function render(){
  const body = $('body'); let html;
  const fin = isFinal(); wasFinal = fin;
  $('ttl').textContent = fin ? 'Gun Game Trios · ' + L.top5 : 'Gun Game Trios';
  if (fin){   // турнир окончен — итоговый ТОП-5 (+ своя команда, если не попала)
    const rows = Object.entries(all).sort((a, b) => b[1] - a[1]);
    const top = rows.filter(([n]) => rank[n] <= 5).slice(0, 7);   // при общих тирах не раздуваем таблицу
    const mine = rows.filter(([n]) => picked.includes(n) && rank[n] > 5);
    const row = ([n]) => `<div class="row f ${place(rank[n], rankEnd[n]) === 'p10' ? '' : place(rank[n], rankEnd[n])}${picked.includes(n) ? ' me' : ''}" data-t="${esc(n)}">
      <span class="r mono">${rank[n]}</span>
      <div class="t"><div class="tw"><span class="tx">${esc(n)}</span>${lvl(rank[n], rankEnd[n]) && lvl(rank[n], rankEnd[n]) <= 3 ? mark(rank[n], rankEnd[n]) : ''}</div></div>
      <span class="rv"><span class="n mono"></span><span class="of9 mono">/9</span></span></div>`;
    html = top.map(row).join('') + (mine.length ? '<div class="sep">···</div>' + mine.map(row).join('') : '');
  } else if (picked.length === 1){
    const t = picked[0], p = pts[t] || 0;
    const hasCat = CONFIG.players && t === CAT_TEAM;
    const nk = CONFIG.players && TEAMS[t] ? `<span class="nk">${nicks(t)}</span><span class="rk">—</span>` : '';
    const sub = nk + `<span class="rk">#${rk(t)} ${L.of} ${TOTAL}</span>`;
    html = `<div class="one ${place(rank[t], rankEnd[t])}">
      <div style="min-width:0"><div class="name"><span class="tx">${esc(t)}</span>${mark(rank[t], rankEnd[t])}</div>${sub ? `<div class="sub${hasCat ? ' has-cat' : ''}">${hasCat ? CAT : ''}${sub}</div>` : ''}</div>
      <div class="pts" data-t="${esc(t)}"><span class="n mono"></span><span class="of9 mono">/9</span><small class="lbl"></small></div></div>`;
  } else {
    const list = [...picked].sort((a, b) => (pts[b] || 0) - (pts[a] || 0));
    html = list.map((t, i) => `<div class="row ${i === 0 && pts[t] ? 'lead' : ''} ${place(rank[t], rankEnd[t])}" data-t="${esc(t)}">
      <span class="r mono">${rank[t] || "–"}</span>
      <div class="t"><div class="tw"><span class="tx">${esc(t)}</span>${mark(rank[t], rankEnd[t])}</div>${CONFIG.players && TEAMS[t] ? `<span class="rn">${TEAMS[t].join(' · ')}</span>` : ''}</div>
      <span class="rv"><span class="n mono"></span><span class="of9 mono">/9</span></span></div>`).join('');
  }
  if (html !== lastHTML){   // DOM трогаем только при изменениях, чтобы анимации не перезапускались
    body.innerHTML = lastHTML = html;
    const r = rank[picked[0]];
    if (picked.length === 1 && lastRank !== undefined && r && r !== lastRank) body.firstElementChild.classList.add('chg');
    lastRank = r;
    placeCat();
  }
  body.querySelectorAll('[data-t]').forEach(el => {
    const t = el.dataset.t, n = el.querySelector('.n');
    const v = (fin ? all[t] : pts[t]) || 0, d = String(v).length;   // баллы обновляем на месте, без пересоздания баннера
    const tv = v >= 10 ? '✓' : String(v || '–');   // 10 = все цепочки пройдены
    if (n.textContent !== tv) n.textContent = tv;
    const of9 = el.querySelector('.of9'); if (of9) of9.style.display = v >= 10 || !v ? 'none' : '';
    const lb = el.querySelector('.lbl');
    if (lb){ const lt = v >= 10 ? L.done : v ? L.tiers[v - 1] || L.pts : L.pts; if (lb.textContent !== lt) lb.textContent = lt; }
    n.classList.toggle('d3', d === 3); n.classList.toggle('d4', d >= 4);
    if (prev[t] !== undefined && prev[t] !== v){ n.classList.add('bump'); setTimeout(() => n.classList.remove('bump'), 260); }
    prev[t] = v;
  });
  $('dot').className = 'dot' + (live ? ' live' : Date.now() >= CONFIG.start ? ' err' : '');
}

/* таймер */
const fmt = ms => { const s = Math.max(0, ms / 1000 | 0); return [s / 3600 | 0, (s / 60 | 0) % 60, s % 60].map(v => String(v).padStart(2, '0')).join(':'); };
const tick = () => { const now = Date.now(), el = $('clock');
  const txt = now < CONFIG.start ? L.start + ' ' + fmt(CONFIG.start - now) : now < CONFIG.end ? L.left + ' ' + fmt(CONFIG.end - now) : L.fin;
  if (el.textContent !== txt) el.textContent = txt;
  if (isFinal() !== wasFinal) render(); };   // в момент финиша баннер сам переключается на ТОП-5

/* автообновление со страницы турнира */
function parse(html){
  const doc = new DOMParser().parseFromString(html, 'text/html'), lines = [];
  (function walk(n){ if (n.nodeType === 3){ const t = n.textContent.trim(); if (t) lines.push(t); }
    else if (!/^(SCRIPT|STYLE|NOSCRIPT)$/.test(n.nodeName)) n.childNodes.forEach(walk); })(doc.body);
  let i = lines.findIndex(l => /participant progress|прогресс участник/i.test(l));
  if (i < 0) return null;
  const blocks = []; let cur = null;
  for (i++; i < lines.length; i++){
    if (/^(live stream|прямая трансляция|трансляция)$/i.test(lines[i])) break;
    const k = LOWER.indexOf(lines[i].toLowerCase());
    if (k >= 0){ cur = {name: NAMES[k], txt: ''}; blocks.push(cur); }
    else if (cur) cur.txt += ' ' + lines[i];
  }
  const out = {};
  for (const b of blocks){
    if (/not available|недоступ|нет данных/i.test(b.txt)) continue;
    // формат сайта: «Tier 2 — Марксманские винтовки»; пройдено всё — «completed / завершено / победитель»
    if (/complet|finish|winner|заверш|выполн|победит/i.test(b.txt)) { out[b.name] = 10; continue; }
    const m = b.txt.match(/(?:tier|тир)\s*(\d+)/i);
    if (m && +m[1] >= 1 && +m[1] <= 9) out[b.name] = +m[1];
  }
  setTotal(new Set(blocks.map(b => b.name)).size);   // сколько команд в командном зачёте (после старта не меняется)
  return Object.keys(out).length ? out : null;
}
/* бережный опрос сайта:
   - до старта раз в 5 минут, во время турнира раз в poll сек, через 15 мин после конца — стоп
   - один запрос за раз, таймаут 10 сек
   - при ошибках сайта (429/5xx/сеть) пауза растёт ×2, до 2 минут
   - у каждого OBS свой случайный сдвиг, чтобы все не стучались в одну секунду */
const POLL = Math.max(10, CONFIG.poll) * 1000, STOP = CONFIG.end + 15 * 60e3;
let backoff = 0;
async function pull(){
  let ok = false;
  const ctrl = new AbortController(), to = setTimeout(() => ctrl.abort(), 10e3);
  try {
    const url = CONFIG.proxy ? CONFIG.proxy + encodeURIComponent(CONFIG.source) : CONFIG.source;
    const r = await fetch(url, {cache: 'no-store', signal: ctrl.signal});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    ok = true;
    const text = await r.text();
    if (text.length > 3e6) throw new Error('too big');   // страница турнира ~50 КБ; гигантский ответ не разбираем
    const data = parse(text);
    live = !!data;
    if (data){
      rank = rankOf(data); all = data;
      picked.forEach(t => { if (t in data) pts[t] = data[t]; });
      save(); try { localStorage.setItem('ggt:all', JSON.stringify(all)); } catch(e){}
    }
  } catch(e){ live = false; }
  clearTimeout(to);
  backoff = ok ? 0 : Math.min(120e3, backoff ? backoff * 2 : POLL * 2);
  render();
}
function nextDelay(){
  const now = Date.now();
  if (now >= STOP) return null;
  const jit = d => d * (0.85 + Math.random() * 0.3);   // ±15%: клиенты не синхронизируются даже после общего сбоя сайта
  if (backoff) return jit(backoff);
  if (now < CONFIG.start - 5 * 60e3) return Math.min(5 * 60e3, CONFIG.start - 5 * 60e3 - now + Math.random() * POLL);
  return jit(POLL);
}
async function loop(){
  await pull();
  const d = nextDelay();
  if (d !== null) setTimeout(loop, d);
}

if (q.get('timer') === '0') $('clock').style.display = 'none';
if (q.get('style')) document.body.classList.add('s-' + q.get('style').toLowerCase());
render(); tick(); setInterval(tick, 1000);
setTimeout(loop, 500 + Math.random() * 4500);   // первый запрос в окне 0,5–5 с: массовый старт OBS не бьёт в одну секунду
if (document.fonts) document.fonts.ready.then(placeCat);
setTimeout(placeCat, 1500);
</script>
